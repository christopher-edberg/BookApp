<div class="container py-4">
  <h1 class="mb-4">Add new book</h1>
  <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
    <div class="mb-1">
      <label for="title" class="form-label">
        Title
      </label>

      <input id="title" type="text" class="form-control" formControlName="title">
    </div>

    <div class="mb-2">
      <label for="author" class="form-label">
        Author
      </label>

      <input id="author" type="text" class="form-control" formControlName="author">
    </div>

    <label for="text" class="form-label">
      Review
    </label>
    <textarea id="review" class="form-control" formControlName="review" rows="4"></textarea>
    @if (bookForm.controls['review'].invalid && bookForm.controls['review'].touched) {
    <div class="text-danger mt-1">
      Review required
    </div>
    }
    <div class="mb-3">
      <label for="publicationDate" class="form-label">
        Publication date
      </label>
      <input id="publicationDate" type="date" class="form-control" formControlName="publicationDate">
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="bookForm.invalid">
      Add book
    </button>
    <a routerLink="/books" class="btn btn-secondary ms-2">
      Cancel
    </a>
  </form>
</div>
